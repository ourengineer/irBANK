[package]
name = "irbank"
version = "1.0.0"
edition = "2021"
authors = ["Algie Bookshelves <engineering@ourengineer.com>"]
description = "Intellectual Property Bank - Secure, War-Proof and Hack-Proof Banking System"
license = "MIT"
repository = "https://github.com/ourengineer/irBANK"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography and hashing
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
aes-gcm = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Logging and tracing
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
dotenv = "0.15"

# Validation and patterns
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
ipnetwork = "0.20"

# Geolocation
geolocation = "0.1"
maxminddb = "0.23"
geoip2 = "0.1"

# Utilities
lazy_static = "1.4"

[[bin]]
name = "irbank_cli"
path = "src/main.rs"

[lib]
name = "irbank"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
