[package]
name = "irbank"
version = "1.0.0"
edition = "2021"
authors = ["Algie Bookshelves <engineering@ourengineer.com>"]
description = "Intellectual Property Bank - Secure, War-Proof and Hack-Proof Database System"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
argon2 = "0.5"
rand = "0.8"
geolocation = "0.1"
maxminddb = "0.23"
geoip2 = "0.1"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hex = "0.4"
lazy_static = "1.4"
dotenv = "0.15"
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"
ipnetwork = "0.20"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "irbank_cli"
path = "src/main.rs"

[lib]
name = "irbank"
path = "src/lib.rs"
